services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: neuroflow-postgres
    env_file:
      - ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: neuroflow-redis
    command: >
      sh -c "redis-server \
      --requirepass \"$${REDIS_PASSWORD}\" \
      --maxmemory 512mb \
      --maxmemory-policy allkeys-lru"
    env_file:
      - ../.env
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: neuroflow-mlflow
    command: >
      sh -c "mlflow server \
      --host 0.0.0.0 \
      --port 5000 \
      --backend-store-uri postgresql://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@postgres:5432/$${POSTGRES_DB}"
    env_file:
      - ../.env
    ports:
      - "5050:5000"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: neuroflow-api
    ports:
      - "8000:8000"
    environment:
      - INGEST_STORAGE_DIR=/app/data/ingestion
    volumes:
      - ingestion_data:/app/data/ingestion
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_started
    env_file:
      - ../.env
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: neuroflow-worker
    command: arq pipelines.ingestion.worker.WorkerSettings
    environment:
      - INGEST_STORAGE_DIR=/app/data/ingestion
    volumes:
      - ingestion_data:/app/data/ingestion
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: neuroflow-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"

volumes:
  postgres_data:
  ingestion_data: